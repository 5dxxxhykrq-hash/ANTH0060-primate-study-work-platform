name: Validate site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check app.js
      - name: Check calendar sync script
        run: python -m py_compile scripts/sync_calendars.py
